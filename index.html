<!DOCTYPE html>
<html lang="vi" data-theme="cyber-violet">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HỆ THỐNG BÁO ỨNG // VR HOLOGRAM GATE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/themes.css" />
  <link rel="stylesheet" href="./css/gate.css" />
</head>
<body>
  <!-- LỚP ẢNH NỀN TÙY CHỈNH TỪ js/config.js + KHÔNG GIAN 3D VR -->
  <div class="bg-image-layer" id="bg-image-layer" aria-hidden="true"></div>
  <canvas id="vr-canvas" aria-hidden="true"></canvas>
  <div class="vr-floor-grid" aria-hidden="true"></div>
  <div class="vr-vignette" aria-hidden="true"></div>
  <div class="scanlines" id="scanlines-layer" aria-hidden="true"></div>

  <!-- CON TRỎ TỌA ĐỘ ẢO -->
  <div class="touch-hud-cursor" id="touch-cursor" aria-hidden="true">
    <span id="cursor-coords">X:000 Y:000</span>
  </div>

  <!-- THANH TRÊN CÙNG (KHÔNG CÓ NÚT SETTING CHO USER) -->
  <header class="sys-topbar">
    <!-- BÊN TRÁI: VỀ TRANG CHỦ BÁO ỨNG -->
    <div class="topbar-left">
      <a href="https://vennelwyn-del.github.io/Baoungdoinhau/" class="home-brand holo-tactile" id="btn-home" title="Về Trang Chủ Báo Ứng">
        <span class="brand-glyph">⚖️</span>
        <span class="brand-text">
          <strong>BÁO ỨNG // VR-00</strong>
          <small>TRANG CHỦ HỆ THỐNG</small>
        </span>
      </a>
    </div>

    <!-- BÊN PHẢI: RADIO + CHUYỂN 2 TEMPLATE MÀU + TÀI KHOẢN FIREBASE -->
    <div class="topbar-right">
      <div class="sys-radio">
        <button class="radio-btn holo-tactile" id="radio-toggle" type="button" title="Bật/Tắt Radio">
          <span class="radio-icon">▶</span>
        </button>
        <div class="radio-meta">
          <span class="radio-title" id="radio-track-name">CH.01 // VOID DRONE</span>
          <canvas id="radio-scope" width="54" height="16"></canvas>
        </div>
        <button class="radio-btn holo-tactile" id="radio-next" type="button" title="Đổi bài/kênh">⏭</button>
        <input class="radio-vol" id="radio-vol" type="range" min="0" max="1" step="0.05" value="0.35" title="Âm lượng" />
      </div>

      <!-- 2 TEMPLATE MÀU -->
      <div class="theme-switcher" role="group" aria-label="Chuyển đổi 2 template màu">
        <button class="theme-dot" data-set-theme="cyber-violet" title="Template 1: #3F136D / #6F1594 / #3BB8F8 / #F787F8">
          <span style="background: linear-gradient(135deg, #3F136D, #3BB8F8, #F787F8);"></span>
        </button>
        <button class="theme-dot" data-set-theme="acid" title="Template 2: #B2F601 / #62C0F6 / #343645">
          <span style="background: linear-gradient(135deg, #B2F601, #62C0F6, #343645);"></span>
        </button>
      </div>

      <button class="user-pill holo-tactile" id="btn-auth" type="button">
        <span class="user-status-dot" id="user-dot"></span>
        <span class="user-label" id="user-label">ĐĂNG NHẬP</span>
      </button>
    </div>
  </header>

  <main class="vr-room" id="vr-room">
    <!-- =========================================================
         GIAO DIỆN 1: CHỈ HIỆN GATE ĐỂ NHẤN VÀO
         ========================================================= -->
    <section class="gate-stage-1" id="screen-gate">
      <button class="holo-gate" id="portal-gate" type="button" aria-label="Chạm vào cổng để vào Hệ Thống Báo Ứng">
        <svg class="gate-svg g-ring-1" viewBox="0 0 420 420" aria-hidden="true">
          <circle cx="210" cy="210" r="202" stroke-dasharray="2 9" />
          <circle cx="210" cy="210" r="188" stroke-dasharray="60 18 12 18" />
        </svg>
        <svg class="gate-svg g-ring-2" viewBox="0 0 420 420" aria-hidden="true">
          <polygon points="210,24 371,117 371,303 210,396 49,303 49,117" />
          <circle cx="210" cy="210" r="146" stroke-dasharray="12 6" />
        </svg>
        <svg class="gate-svg g-ring-3" viewBox="0 0 420 420" aria-hidden="true">
          <path d="M 210 86 A 124 124 0 0 1 334 210" class="arc-a" />
          <path d="M 210 334 A 124 124 0 0 1 86 210" class="arc-b" />
        </svg>

        <div class="gate-touch-core">
          <div class="scan-laser" id="gate-scan-laser"></div>
          <span class="core-kicker">AI // HOLOGRAPHIC GATE</span>
          <strong class="core-title">BÁO ỨNG</strong>
          <span class="core-sub" id="gate-action-text">[ NHẤN VÀO ]</span>
          <div class="core-meter" id="core-progress"><span></span></div>
        </div>
      </button>
    </section>
</body>
</html>
