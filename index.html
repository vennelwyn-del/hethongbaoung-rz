<!DOCTYPE html>
<html lang="vi" data-theme="cyber-violet">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HỆ THỐNG BÁO ỨNG // RADIAL GATE 00</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/themes.css" />
  <link rel="stylesheet" href="./css/gate.css" />
</head>
<body>
  <div class="bg-image-layer" id="bg-image-layer" aria-hidden="true"></div>
  <canvas id="vr-canvas" aria-hidden="true"></canvas>
  <div class="vr-vignette" aria-hidden="true"></div>
  <div class="scanlines" id="scanlines-layer" aria-hidden="true"></div>

  <div class="touch-hud-cursor" id="touch-cursor" aria-hidden="true">
    <span id="cursor-coords">X:000 Y:000</span>
  </div>

  <!-- TOPBAR -->
  <header class="sys-topbar">
    <div class="topbar-left">
      <a href="./index.html" class="home-brand holo-tactile" id="btn-home" title="Về Trang Chủ Báo Ứng">
        <span class="brand-glyph">⚖️</span>
        <span class="brand-text">
          <strong>BÁO ỨNG // VR-00</strong>
          <small>TRANG CHỦ HỆ THỐNG</small>
        </span>
      </a>
    </div>

    <div class="topbar-right">
      <div class="sys-radio">
        <button class="radio-btn holo-tactile" id="radio-toggle" type="button"><span class="radio-icon">▶</span></button>
        <div class="radio-meta">
          <span class="radio-title" id="radio-track-name">CH.01 // VOID DRONE</span>
          <canvas id="radio-scope" width="54" height="16"></canvas>
        </div>
        <button class="radio-btn holo-tactile" id="radio-next" type="button">⏭</button>
        <input class="radio-vol" id="radio-vol" type="range" min="0" max="1" step="0.05" value="0.35" />
      </div>

      <div class="theme-switcher" role="group">
        <button class="theme-dot" data-set-theme="cyber-violet" title="Template 1: Tím-Xanh">
          <span style="background: linear-gradient(135deg, #3F136D, #3BB8F8, #F787F8);"></span>
        </button>
        <button class="theme-dot" data-set-theme="acid" title="Template 2: Acid-Xanh">
          <span style="background: linear-gradient(135deg, #B2F601, #62C0F6, #343645);"></span>
        </button>
      </div>

      <button class="user-pill holo-tactile" id="btn-auth" type="button">
        <span class="user-status-dot" id="user-dot"></span>
        <img id="topbar-avatar" class="user-avatar-mini hidden" src="" alt="" />
        <span class="user-label" id="user-label">ĐĂNG NHẬP</span>
      </button>
    </div>
  </header>

  <!-- GIAO DIỆN 1: RADIAL TECH GATE THEO ẢNH 2 -->
  <main class="vr-room">
    <section class="radial-gate-stage" id="screen-gate">
      <!-- Dải mạch điện bên trái -->
      <div class="circuit-wing left-wing" aria-hidden="true">
        <div class="data-blocks"><i></i><i></i><i class="lit"></i><i></i></div>
        <div class="circuit-track"><span class="chevrons">◀◀◀◀◀</span></div>
        <div class="circuit-subline"></div>
      </div>

      <!-- Cổng tròn trung tâm + 8 tia nút tọa độ -->
      <button class="holo-gate radial-core-btn" id="portal-gate" type="button" aria-label="Nhấn để vào Hệ Thống Báo Ứng">
        <svg class="gate-svg g-rays" viewBox="0 0 500 500" aria-hidden="true">
          <!-- 8 tia phóng xạ kết thúc bằng chấm tròn giống Ảnh 2 -->
          <line x1="250" y1="250" x2="290" y2="38" /><circle cx="290" cy="38" r="5" />
          <line x1="250" y1="250" x2="425" y2="95" /><circle cx="425" cy="95" r="5" />
          <line x1="250" y1="250" x2="470" y2="250" /><circle cx="470" cy="250" r="4.5" />
          <line x1="250" y1="250" x2="365" y2="462" /><circle cx="365" cy="462" r="5" />
          <line x1="250" y1="250" x2="175" y2="455" /><circle cx="175" cy="455" r="4.5" />
          <line x1="250" y1="250" x2="45" y2="412" /><circle cx="45" cy="412" r="5" />
          <line x1="250" y1="250" x2="32" y2="250" /><circle cx="32" cy="250" r="4.5" />
          <line x1="250" y1="250" x2="82" y2="112" /><circle cx="82" cy="112" r="5" />
        </svg>

        <svg class="gate-svg g-ring-1" viewBox="0 0 420 420" aria-hidden="true">
          <circle cx="210" cy="210" r="196" stroke-dasharray="1.5 5" />
          <circle cx="210" cy="210" r="172" stroke-dasharray="70 18 18 18" />
        </svg>
        <svg class="gate-svg g-ring-2" viewBox="0 0 420 420" aria-hidden="true">
          <circle cx="210" cy="210" r="150" stroke-dasharray="36 12 8 12" />
          <circle cx="210" cy="210" r="136" stroke-dasharray="3 4" />
        </svg>

        <div class="gate-touch-core">
          <div class="scan-laser" id="gate-scan-laser"></div>
          <span class="core-kicker">SYSTEM // TERMINAL 00</span>
          <strong class="core-title">BÁO ỨNG</strong>
          <span class="core-sub" id="gate-action-text">[ NHẤN VÀO ]</span>
          <div class="core-meter" id="core-progress"><span></span></div>
        </div>
      </button>

      <!-- Dải mạch điện bên phải -->
      <div class="circuit-wing right-wing" aria-hidden="true">
        <div class="data-blocks"><i class="lit"></i><i></i><i></i><i class="lit"></i></div>
        <div class="circuit-track"><span class="chevrons">▶▶▶▶▶</span></div>
        <div class="circuit-subline"></div>
      </div>
    </section>
  </main>

  <!-- MODAL TÀI KHOẢN FIREBASE -->
  <div class="modal-backdrop hidden" id="modal-auth">
    <div class="sys-modal">
      <div class="modal-head">
        <h3>🪪 TÀI KHOẢN CON NỢ // AVATAR &amp; FIREBASE</h3>
        <button class="modal-close" data-close-modal="modal-auth" type="button">✕</button>
      </div>
      <div class="modal-body">
        <div id="auth-logged-out">
          <p class="auth-desc">Tạo nhanh Tên tài khoản &amp; Mật khẩu để lưu mã Con nợ, Avatar và Phước Báu.</p>
          <form id="simple-auth-form" class="auth-form">
            <input type="text" id="auth-username" placeholder="Tên tài khoản (vd: conno01)..." required />
            <input type="password" id="auth-pass" placeholder="Mật khẩu (>= 4 ký tự)..." required />
            <div class="auth-actions">
              <button class="btn-primary holo-tactile" type="submit">Đăng nhập</button>
              <button class="btn-secondary holo-tactile" type="button" id="btn-register-simple">Tạo tài khoản mới</button>
            </div>
          </form>
          <p class="auth-msg" id="auth-msg"></p>
        </div>

        <div id="auth-logged-in" class="hidden">
          <div class="profile-box">
            <img id="profile-avatar" class="profile-avatar-lg" src="" alt="Avatar" />
            <div>
              <strong id="profile-name">Chưa ký hợp đồng</strong>
              <p id="profile-username">@username</p>
              <p class="pb-tag">Phước Báu: <span id="profile-pb">Chưa ký hợp đồng (-- PB)</span></p>
            </div>
          </div>

          <div class="avatar-editor">
            <label>ĐỔI AVATAR CON NỢ (Link ảnh hoặc tải từ máy)</label>
            <div class="avatar-row">
              <input type="url" id="avatar-url-input" placeholder="Dán link ảnh Avatar..." />
              <button class="btn-secondary holo-tactile" id="btn-save-avatar-url" type="button">Lưu</button>
            </div>
            <label class="file-upload-btn holo-tactile">
              📁 Chọn ảnh từ máy
              <input type="file" id="avatar-file-input" accept="image/*" hidden />
            </label>
          </div>

          <div class="auth-actions">
            <button class="btn-danger holo-tactile" id="btn-logout" type="button">Đăng xuất</button>
          </div>
          <p class="auth-msg" id="auth-sync-msg"></p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
